site_name: AWS Compliance Agent
site_description: Governed agentic AWS SecOps learning portal
site_url: https://amitkarpe.github.io/aws-secops/
repo_url: https://github.com/amitkarpe/aws-secops
repo_name: amitkarpe/aws-secops

site_dir: site

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Home: index.md
  - Learn:
      - 3-minute demo: operations/AGENTIC_DEMO_3_MIN.md
      - Management audit view: operations/MANAGEMENT_AUDIT_VIEW.md
      - Start here: learning-path.md
      - Current architecture: architecture.md
      - Persistent MCP evidence adapter: architecture/PERSISTENT_MCP_EVIDENCE_ADAPTER.md
      - Governance / security model: governance.md
      - Long Demo v1: demo-v1.md
  - AgentCore Lab:
      - Overview: research/index.md
      - Current Harness experiment: research/agentcore-harness-operator-experiments.md
      - Components and capabilities: research/AGENTCORE_FEATURE_MATRIX.md
      - Earlier live proofs:
          - Gateway + Policy proof: research/GATEWAY_POLICY_LIVE_PROOF.md
          - Harness runtime proof: research/HARNESS_NOVA2_LITE_LIVE_PROOF.md
      - Reference:
          - Model access matrix: research/MODEL_ACCESS_MATRIX.md
          - Cost model: research/COST_MODEL_V0.md
          - Connector safety notes: research/CHATGPT_CONNECTOR_SAFETY_FRAMING.md
  - Operations:
      - LibreChat bulk demo (historical S3-specific): operations/LIBRECHAT_BULK_DEMO.md
      - Cost and cleanup: operations/COST_AND_CLEANUP.md
  - Technical proofs:
      - Reliability hardening: implementation/RELIABILITY_HARDENING_PROOF.md
      - Governed S3 execution: implementation/PLATFORM_PHASE11_13_PROOF.md
  - Project:
      - Project status: project-status.md
      - Operations Console direction: operator-console.md
      - Roadmap: roadmap.md
  - History:
      - Earlier multi-source pilot demo: operations/DEMO_SCRIPT.md
      - Phase 0B research plan: research/PHASE0B_PLAN.md
