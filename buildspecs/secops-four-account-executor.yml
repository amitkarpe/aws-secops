version: 0.2

env:
  exported-variables:
    - SECOPS_RESULT_B64

phases:
  build:
    on-failure: ABORT
    commands:
      - export PYTHONPATH="$CODEBUILD_SRC_DIR"
      - SECOPS_RESULT_B64="$(python3 scripts/codebuild_issue82_executor.py)"
      - export SECOPS_RESULT_B64
      - test -n "$SECOPS_RESULT_B64"
