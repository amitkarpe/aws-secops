name: Publish Compliance Agent v1.0.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-compliance-v1-release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish immutable v1.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          ## Compliance Agent v1.0.0

          First clean Compliance Agent baseline built on Amazon Bedrock AgentCore Harness.

          ### Highlights
          - Dedicated tool-free AgentCore Harness `compliance_agent_v1`
          - Unified four-account Config evidence: `lab-dev`, `lab-poc`, `lab-qa`, `lab-sec`
          - Two supported controls: S3 Block Public Access and restricted SSH
          - Read-only v1 agent boundary with no mutation capability
          - LibreChat presentation shell with exactly one MCP tool: `ask_compliance_agent_v1`
          - GitHub Releases are the canonical user-facing release history

          ### Acceptance evidence
          - Config backend: PASS — 4 aliases × 2 controls = 8 checks
          - AgentCore Harness golden prompts: PASS 5/5
          - Identifier fidelity: PASS
          - Approval/execution boundary: PASS
          - Installed MCP bridge: PASS
          - Authenticated LibreChat UI smoke: PASS
          - Evidence payload bounded below the Harness prompt ceiling: PASS
          - Final direct MCP invocation: PASS, `mutation=false`
          - Regression CI: PASS — full suite #256 plus dedicated v1 runtime job
          - Live proof date: 2026-09-20

          ### Architecture
          `LibreChat -> compliance_agent_v1 MCP -> unified Config backend -> AgentCore Harness -> Nova 2 Lite -> response`

          AgentCore Memory is intentionally not authoritative operational audit storage. Structured operational event history remains the first audit/history mechanism; RAG is deferred until unstructured knowledge justifies it.

          ### Known limitations
          - v1 supports only the four registered LAB aliases and the two controls above.
          - v1 does not execute remediation.
          - Account/resource identifiers are returned only when present in authorized evidence.
          - No generic AWS administration capability is exposed.

          ### Exact release commit
          `229644d7c5408fd5e06de353297e80a2f10389fc`

          ### Rollback/reference
          Previous verified runtime baseline: `1afe9d1f47389bf480b68b20a22ef50054ae64db`
          EOF

          gh release create compliance-agent-v1.0.0             --repo "$GITHUB_REPOSITORY"             --target 229644d7c5408fd5e06de353297e80a2f10389fc             --title "Compliance Agent v1.0.0"             --notes-file /tmp/release-notes.md
