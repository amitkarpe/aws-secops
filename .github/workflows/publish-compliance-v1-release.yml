name: Publish Compliance Agent v1.0.0

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-compliance-agent-v1-0-0
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate immutable release input
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: compliance-agent-v1.0.0
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -s agents/compliance-agent-v1/RELEASE_NOTES.md
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release tag already exists" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release already exists" >&2
            exit 1
          fi

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: compliance-agent-v1.0.0
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Compliance Agent v1.0.0" \
            --notes-file agents/compliance-agent-v1/RELEASE_NOTES.md

      - name: Verify tag and release target
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: compliance-agent-v1.0.0
        run: |
          set -euo pipefail
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
          release_target=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.target_commitish')
          test "$tag_sha" = "$GITHUB_SHA"
          test "$release_target" = "$GITHUB_SHA"
          printf 'RELEASE_TAG=%s\nRELEASE_COMMIT=%s\n' "$RELEASE_TAG" "$GITHUB_SHA"
