name: AWS deployment canary

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-secops-deployment-canary
  cancel-in-progress: false

jobs:
  deploy-canary:
    if: github.ref == 'refs/heads/main' && github.repository == 'amitkarpe/aws-secops' && vars.AWS_DEPLOY_CANARY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-southeast-1
      AWS_ROLE_ARN: ${{ vars.AWS_SECOPS_DEPLOY_CANARY_ROLE_ARN }}
      AWS_ALLOWED_ACCOUNT_ID: ${{ vars.AWS_ALLOWED_ACCOUNT_ID }}
      STACK_NAME: aws-secops-deployment-canary
      PARAMETER_NAME: /amitkarpe/aws-secops/deployment-canary
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Require configured deployment identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AWS_ROLE_ARN:-}"
          test -n "${AWS_ALLOWED_ACCOUNT_ID:-}"

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ALLOWED_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Verify caller and Region
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          test "$ACCOUNT_ID" = "$AWS_ALLOWED_ACCOUNT_ID"
          test "$AWS_REGION" = "ap-southeast-1"

      - name: Validate canary template
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation validate-template \
            --template-body file://infra/deployment-canary/template.yml >/dev/null

      - name: Apply isolated canary stack
        shell: bash
        run: |
          set -euo pipefail
          if aws cloudformation describe-stacks --stack-name "$STACK_NAME" >/dev/null 2>&1; then
            set +e
            UPDATE_OUTPUT="$(aws cloudformation update-stack \
              --stack-name "$STACK_NAME" \
              --template-body file://infra/deployment-canary/template.yml \
              --parameters "ParameterKey=DeploymentMarker,ParameterValue=${GITHUB_SHA}" 2>&1)"
            UPDATE_RC=$?
            set -e
            if [ "$UPDATE_RC" -eq 0 ]; then
              aws cloudformation wait stack-update-complete --stack-name "$STACK_NAME"
            elif ! grep -q 'No updates are to be performed' <<<"$UPDATE_OUTPUT"; then
              echo "CloudFormation canary update failed; inspect with authorized AWS tooling." >&2
              exit "$UPDATE_RC"
            fi
          else
            aws cloudformation create-stack \
              --stack-name "$STACK_NAME" \
              --template-body file://infra/deployment-canary/template.yml \
              --parameters "ParameterKey=DeploymentMarker,ParameterValue=${GITHUB_SHA}" >/dev/null
            aws cloudformation wait stack-create-complete --stack-name "$STACK_NAME"
          fi

      - name: Provider readback
        shell: bash
        run: |
          set -euo pipefail
          MARKER="$(aws ssm get-parameter --name "$PARAMETER_NAME" --query Parameter.Value --output text)"
          test "$MARKER" = "$GITHUB_SHA"
          echo "GitHub OIDC deployment canary: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Demo v1 mutation: NO" >> "$GITHUB_STEP_SUMMARY"
